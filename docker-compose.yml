services:
  api1:
      build: .
      expose:
        - "5000"
      environment:
        PORT: 5000
        INSTANCE_ID: api1
        MONGO_URI: ${MONGO_URI}
        REDIS_URI: redis://redis:6379
      depends_on:
        - redis

  api2:
    build: .
    expose:
      - "5000"
    environment:
      PORT: 5000
      INSTANCE_ID: api2
      MONGO_URI: ${MONGO_URI}
      REDIS_URI: redis://redis:6379
    depends_on:
      - redis
  
  redis:
    image: redis:7-alpine
    container_name: task-api-redis
    ports:
      - "6379:6379"        

  nginx:
    image: nginx:alpine
    container_name: task-api-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2